version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: js-library
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: library_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  pgdata: